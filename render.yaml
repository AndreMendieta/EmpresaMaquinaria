services:
  - type: web
    name: hydrotech-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm --prefix backend ci && npm run build:web
    startCommand: npm --prefix backend run migrate && npm --prefix backend run migrate:multitenant && npm --prefix backend start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hydrotech-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: hydrotech-db
    databaseName: hydrotech
    user: hydrotech
    plan: free
